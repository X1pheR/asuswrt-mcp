name: Bug report
description: Report reproducible ASUSWRT MCP behavior that does not match the documented contract.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include router passwords, SSH private keys, Wi-Fi PSKs, VPN keys/peers/endpoints, private network inventories, or raw sensitive router configuration. Security vulnerabilities must be reported privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: ASUSWRT MCP version
      description: Release tag or exact commit SHA.
      placeholder: v0.2.0
    validations:
      required: true
  - type: input
    id: router
    attributes:
      label: Router and firmware
      description: Sanitized router model/runtime identity and firmware version.
      placeholder: XT8PRO / 388_xxxxx
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps with secrets, private addresses and client data removed.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant MCP client, operating system, Python version and sanitized error text.
