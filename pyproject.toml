[project]
name = "hypershell-asuswrt-mcp"
version = "0.2.1"
description = "Community-maintained downstream MCP server for bounded AsusWRT and AsusWRT-Merlin administration over SSH."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ronald de Wit" }]
dependencies = [
    "mcp>=1.29.1,<2",
    "asusrouter>=1.21,<2",
    "paramiko>=5,<6",
    "pydantic-settings>=2.14,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Repository = "https://github.com/X1pheR/asuswrt-mcp"
Upstream = "https://github.com/teefloo/asuswrt-mcp"
Issues = "https://github.com/X1pheR/asuswrt-mcp/issues"

[project.scripts]
asuswrt-mcp = "asuswrt_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asuswrt_mcp"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

